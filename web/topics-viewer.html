<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Session Bridge · Topics</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/admin/assets/brand/png/icon-indigo-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/pearl-gradient-nav.css">
  <link rel="stylesheet" href="/admin/assets/admin-confirmation.css">
  <link rel="stylesheet" href="/admin/assets/topics-viewer.css">
</head>
<body data-workspace="topics" data-settings-tab="topics">
  <header class="workspace-bar">
    <a class="workspace-brand" href="/admin/sessions" aria-label="MCP Session Bridge Sessions">
      <img src="/admin/assets/brand/svg/lockup-horizontal-dark.svg" alt="MCP Session Bridge">
    </a>
    <nav class="workspace-nav sb-nav" role="tablist" aria-label="Admin workspaces">
      <a class="sb-nav__tab" role="tab" href="/admin/sessions" aria-selected="false" tabindex="-1" data-label="SESSIONS">SESSIONS</a>
      <a class="sb-nav__tab" role="tab" href="/admin/topics" aria-current="page" aria-selected="true" tabindex="0" data-label="TOPICS">TOPICS</a>
      <a class="sb-nav__tab" role="tab" href="/admin/contexts" aria-selected="false" tabindex="-1" data-label="CONTEXTS">CONTEXTS</a>
    </nav>
    <div class="workspace-actions">
      <button type="button" class="wa-btn" data-header-action="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search<kbd>⌘K</kbd></button>
      <button type="button" class="wa-icon" data-header-action="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path><path d="M19.4 15a1.8 1.8 0 0 0 .36 2l.05.05a2.2 2.2 0 1 1-3.11 3.11l-.05-.05a1.8 1.8 0 0 0-2-.36 1.8 1.8 0 0 0-1.1 1.66V21.5a2.2 2.2 0 1 1-4.4 0v-.09A1.8 1.8 0 0 0 8.05 19.75a1.8 1.8 0 0 0-2 .36l-.05.05a2.2 2.2 0 1 1-3.11-3.11l.05-.05a1.8 1.8 0 0 0 .36-2A1.8 1.8 0 0 0 1.64 13.9H1.5a2.2 2.2 0 1 1 0-4.4h.14A1.8 1.8 0 0 0 3.3 8.4a1.8 1.8 0 0 0-.36-2l-.05-.05A2.2 2.2 0 1 1 6 3.24l.05.05a1.8 1.8 0 0 0 2 .36A1.8 1.8 0 0 0 9.15 2V1.9a2.2 2.2 0 1 1 4.4 0V2a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 2-.36l.05-.05a2.2 2.2 0 1 1 3.11 3.11l-.05.05a1.8 1.8 0 0 0-.36 2A1.8 1.8 0 0 0 21.1 9.5h.1a2.2 2.2 0 1 1 0 4.4h-.1A1.8 1.8 0 0 0 19.4 15z"></path></svg><span class="wa-dot" data-header-dot hidden></span></button>
      <span class="wa-sep" aria-hidden="true"></span>
      <span class="wa-user" data-header-user></span>
    </div>
  </header>

  <div id="strip" class="tp-strip" aria-label="Topics actions"></div>

  <main class="tp-main">
    <aside id="topicList" class="tp-topics" aria-label="Topics"></aside>
    <section id="listView" class="tp-detail" aria-live="polite"></section>
    <section id="graphView" class="tp-graph-view" hidden>
      <div class="tp-graph-stage">
        <svg id="graph" aria-label="Topics graph"></svg>
        <div id="graphSide" class="tp-graph-controls" aria-label="Graph filters"></div>
        <div id="graphLegend" class="tp-graph-legend"></div>
      </div>
      <aside id="graphInfo" class="tp-graph-info" aria-live="polite"></aside>
    </section>
  </main>

  <dialog id="manage" class="tp-manage" aria-labelledby="manageTitle">
    <div class="tp-manage-head">
      <h2 id="manageTitle">Manage topics</h2>
      <span id="manageMeta" class="tp-muted"></span>
      <span class="tp-spacer"></span>
      <button type="button" class="tp-icon-btn" id="manageClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <div class="tp-manage-body">
      <nav id="manageNav" class="tp-manage-nav" aria-label="Manage topics sections"></nav>
      <section id="manageMain" class="tp-manage-main"></section>
    </div>
  </dialog>

  <div id="tip" class="tp-tip" hidden></div>
  <div id="toast" class="tp-toast" role="status" hidden></div>

  <script src="/admin/assets/d3/d3.min.js"></script>
  <script src="/admin/assets/pearl-gradient-nav.js"></script>
  <script src="/admin/assets/admin-confirmation.js"></script>
  <script src="/admin/assets/bridge-identity.js"></script>
  <script src="/admin/assets/topics-viewer.js"></script>
  <script src="/admin/assets/admin-header.js"></script>
</body>
</html>
